[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultproxy"
version = "0.2.1"
description = "Local-first, OpenAI-compatible privacy proxy for LLM apps focused on Indian data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aniket Chaudhary" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/aniketchaudharyaa113/october"
Repository = "https://github.com/aniketchaudharyaa113/october"

[project.scripts]
vaultproxy = "vaultproxy.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
    "Faker>=24.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vaultproxy*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["scripts/vp_review_check.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "vaultproxy.*"
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=vaultproxy --cov-report=term-missing"
testpaths = ["tests"]
